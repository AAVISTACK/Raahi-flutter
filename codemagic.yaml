workflows:
  android-debug:
    name: Raahi Android Debug APK
    max_build_duration: 60
    environment:
      flutter: 3.19.0
      java: 17
    scripts:
      - name: Flutter pub get + Build APK
        script: |
          # Find Flutter project root
          if [ -d "raahi" ]; then
            PROJECT_DIR="raahi"
          else
            PROJECT_DIR="."
          fi
          
          echo "Building from: $PROJECT_DIR"
          cd $PROJECT_DIR
          
          # Show structure
          ls -la android/
          
          # Get packages
          flutter pub get
          
          # Build debug APK
          flutter build apk --debug --no-tree-shake-icons
          
    artifacts:
      - "**/flutter-apk/app-debug.apk"
      - "**/outputs/**/*.apk"
