workflows:
  android-debug:
    name: Raahi Android Debug APK
    max_build_duration: 60
    environment:
      flutter: 3.19.0
      java: 17
    scripts:
      - name: Check folder structure
        script: |
          echo "Root files:"
          ls -la
          echo "---"
          if [ -d "raahi" ]; then
            echo "raahi/ folder found"
            cd raahi
          else
            echo "No raahi/ folder - using root"
          fi
          flutter pub get
      - name: Build debug APK
        script: |
          if [ -d "raahi" ]; then
            cd raahi
          fi
          flutter build apk --debug
    artifacts:
      - "**/flutter-apk/app-debug.apk"
