name: raahi
description: AI-powered highway assistance app for Indian drivers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # HTTP & Networking
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1

  # Local Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Maps & Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1

  # Voice & AI
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  permission_handler: ^11.3.0

  # UI & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # AdMob
  google_mobile_ads: ^4.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  flutter_native_splash: ^2.3.11
  connectivity_plus: ^6.0.2
  vibration: ^1.8.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ─── App Icon ──────────────────────────────────────────────────────────────────
# FIX: Use app_icon_fg.png (foreground-only, centered in safe zone) for adaptive
# icon so it doesn't get cut off. app_icon.png remains the legacy fallback icon.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

# ─── Splash Screen ─────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0D1B40"
  image: assets/icons/splash_logo.png
  color_dark: "#0D1B40"
  image_dark: assets/icons/splash_logo.png
  android_12:
    color: "#0D1B40"
    image: assets/icons/splash_logo.png
  fullscreen: true
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/data/
