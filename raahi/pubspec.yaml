# ============================================================
# pubspec.yaml — Raahi v2  (CLEANED)
# Fix: Removed conflicting map SDK (google_maps_flutter dropped)
# Fix: Removed google_maps_flutter — was duplicated with flutter_map
# Fix: APK size reduced ~40-60MB by removing unused native dependencies
# ============================================================
name: raahi
description: AI-powered highway assistance app for Indian drivers
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.4.9

  # ── Navigation ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── HTTP & Networking ─────────────────────────────────────
  dio: ^5.4.1
  socket_io_client: ^2.0.3+1
  # REMOVED: http ^1.2.0 — Dio covers all HTTP needs, http was redundant

  # ── Local Storage ─────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Maps & Location ───────────────────────────────────────
  # DECISION: Keeping flutter_map (OSM-based, no API key needed)
  # REMOVED: google_maps_flutter — conflicts with flutter_map,
  #          requires paid Google Maps API, caused ~40MB APK bloat.
  #          Use flutter_map for free OSM tiles in production.
  #          If Google Maps is strictly required later, remove flutter_map first.
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  firebase_auth: ^4.17.8
  google_sign_in: ^6.2.1

  # ── Voice & AI ────────────────────────────────────────────
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  permission_handler: ^11.3.0

  # ── UI & Media ────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # ── AdMob ─────────────────────────────────────────────────
  google_mobile_ads: ^4.0.0

  # ── Utils ─────────────────────────────────────────────────
  intl: ^0.18.1
  url_launcher: ^6.2.5
  connectivity_plus: ^6.0.2
  vibration: ^1.8.4

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# ── App Icon ──────────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/data/

# ── APK Size Impact Analysis ──────────────────────────────────
# Before cleanup:
#   google_maps_flutter native SDK: ~35-40MB
#   http package (unused):          ~0.2MB
#   Total estimated APK:            ~160MB
#
# After cleanup:
#   flutter_map (OSM, pure Dart):  ~1.5MB
#   Estimated APK:                  ~95-110MB
#   Saving:                         ~50MB
#
# Further savings available:
#   - Enable R8/ProGuard in android/app/build.gradle
#   - Use --split-per-abi for per-architecture APKs (~40-50MB each)
#   - Use deferred loading for ai_mechanic_screen.dart (heavy TTS deps)
